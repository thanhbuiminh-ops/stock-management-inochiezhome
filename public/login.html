<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Đăng nhập · Visual Stock</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">
  <main class="login">
    <h1>Inochi · Visual Stock</h1>
    <p class="muted">Chỉ tài khoản được cấp quyền mới xem được.</p>
    <form id="form" autocomplete="on">
      <label>Email
        <input id="email" type="email" name="email" autocomplete="username" required autofocus>
      </label>
      <label>Mật khẩu
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </label>
      <p id="err" class="err" role="alert" hidden></p>
      <button id="submit" type="submit">Đăng nhập</button>
    </form>
  </main>
  <script src="/login.js" defer></script>
</body>
</html>
